RESOURCES=Ressources
HELP_DURATION=La durée reflète le temps de travail effectif.\nSon calcul exclut les jours non travaillés (récurrents ou fériés), ce qui explique qu?elle puisse être plus courte que la période entre les dates de début et de fin.
HELP_EFFORT=L'effort reflète le temps de travail effectif des personnes assignées.\nSon calcul exclut les jours non travaillés(récurrents ou fériés), comme pour la durée, et prend de plus en compte les personnes assignées à la tâche avec leurs périodes de disponibilité.
HELP_DATE=Lorsque la date dépend de l'effort, celui-ci est calculé sans les jours non travaillés(récurrents ou fériés), ce qui peut rendre l'intervalle entre le début et la fin plus long que la durée elle-même.
HELP_ROUNDED_TO_HALF_DAY=Elle est arrondie à la demi journée.
HELP_COMPUTATION_OPTION=Si une date(début ou fin) possède un lien de dépendance vers une autre tâche, ce lien est prioritaire pour le calcul de la date.
