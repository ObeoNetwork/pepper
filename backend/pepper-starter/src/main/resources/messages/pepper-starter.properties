RESOURCES=Resources
HELP_DURATION=Duration reflects the actual time worked.\nIt excludes days not worked (recurring days or holidays), which explains why it may be shorter than the period between the start and end dates
HELP_EFFORT=Effort reflects the actual work time spent by the assigned individuals.\nIts calculation excludes non-working days (recurring or holidays), as with duration, and also takes into account the individuals assigned to the task and their availability periods.
HELP_DATE=When the date depends on the effort, the effort is calculated excluding non-working days (recurring days or holidays), which can make the interval between the start and end dates longer than the duration itself.
HELP_ROUNDED_TO_HALF_DAY=It is rounded to half-day.
HELP_COMPUTATION_OPTION=If a date (start or end) has a dependency on another task, that dependency takes precedence when calculating the date.
